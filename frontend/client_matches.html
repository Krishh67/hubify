<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Matches — Hubify</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    *, body { font-family: 'Inter', system-ui, sans-serif; }
    .grid-bg {
      background-color: #f8fafc;
      background-image:
        linear-gradient(rgba(99,102,241,0.06) 1px, transparent 1px),
        linear-gradient(90deg, rgba(99,102,241,0.06) 1px, transparent 1px);
      background-size: 64px 64px;
    }
    .data-card {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.05);
    }
    .nav-blur {
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      background: rgba(255, 255, 255, 0.9);
    }
  </style>
</head>
<body class="grid-bg min-h-screen text-slate-900 antialiased pb-20">

  <!-- Navbar -->
  <nav class="fixed top-0 left-0 right-0 z-50 h-16 border-b border-slate-200 nav-blur">
    <div class="h-full max-w-7xl mx-auto px-6 flex items-center justify-between">
      <div class="flex items-center gap-6">
        <a href="/" class="flex items-center gap-2.5">
          <div class="w-8 h-8 rounded-lg bg-gradient-to-br from-indigo-500 to-violet-600 flex items-center justify-center flex-shrink-0 shadow-sm">
            <svg class="w-4 h-4 text-white" viewBox="0 0 16 16" fill="none">
              <path d="M3 8.5L6.5 12L13 5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </div>
          <span class="text-base font-bold text-slate-900 tracking-tight hidden sm:block">Hubify</span>
        </a>
        <div class="h-5 w-px bg-slate-200"></div>
        <a href="/client/dashboard" class="text-[13px] font-bold text-slate-500 hover:text-indigo-600 uppercase tracking-widest flex items-center gap-2 transition-colors">
          &larr; Back to Portal
        </a>
      </div>
    </div>
  </nav>

  <div class="max-w-5xl mx-auto px-6 pt-32">
    <div class="mb-10">
      <h1 class="text-3xl font-extrabold text-slate-900 tracking-tight mb-2">Requirement Matches</h1>
      <p class="text-[15px] font-medium text-slate-500">AI-ranked supplier matches sorted by final compatibility score.</p>
    </div>

    <div id="matches-container" class="space-y-6">
      <!-- Loading state -->
      <div class="text-center p-12">
        <svg class="w-8 h-8 animate-spin text-indigo-600 mx-auto" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>
        <p class="mt-4 text-sm font-medium text-slate-500">Loading matches...</p>
      </div>
    </div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      const urlParams = new URLSearchParams(window.location.search);
      const clientId = urlParams.get('id');
      if (!clientId) {
        document.getElementById('matches-container').innerHTML = '<p class="text-red-500 p-6">No requirement ID provided.</p>';
        return;
      }

      try {
        const res = await fetch(`/api/matches?client_id=${clientId}`);
        const matches = await res.json();
        const container = document.getElementById('matches-container');
        
        if (matches && matches.length > 0) {
          container.innerHTML = '';
          
          matches.forEach(m => {
            const supp = m.suppliers || {};
            const prof = supp.profiles || {};
            
            const risksHtml = (m.risks && m.risks.length > 0) ? `<div class="mt-3 bg-amber-50 text-amber-800 p-3 rounded-xl border border-amber-200 text-[13px]"><strong>Risks:</strong> <ul class="list-disc pl-5 mt-1 text-amber-700">` + m.risks.map(r => `<li>${r}</li>`).join('') + `</ul></div>` : '';
            
            const dbHtml = (m.deal_breakers && m.deal_breakers.length > 0) ? `<div class="mt-3 bg-red-50 text-red-800 p-3 rounded-xl border border-red-200 text-[13px]"><strong>Deal Breakers:</strong> <ul class="list-disc pl-5 mt-1 text-red-700">` + m.deal_breakers.map(d => `<li>${d}</li>`).join('') + `</ul></div>` : '';

            container.innerHTML += `
              <div class="data-card rounded-2xl overflow-hidden relative group transition hover:border-indigo-300">
                <div class="absolute top-0 left-0 w-1.5 h-full bg-gradient-to-b ${m.final_score > 80 ? 'from-emerald-400 to-emerald-600' : (m.final_score > 50 ? 'from-amber-400 to-amber-600' : 'from-red-400 to-red-600')}"></div>
                
                <div class="p-6 pl-8">
                  <div class="flex justify-between items-start mb-6">
                    <div>
                      <div class="flex items-center gap-3 mb-2">
                        <span class="inline-flex items-center justify-center bg-slate-100 text-slate-700 text-xs font-bold px-2.5 py-1 rounded-md">Rank #${m.rank}</span>
                        <span class="text-xs font-bold text-slate-400 uppercase tracking-widest">${supp.category || 'Supplier'}</span>
                      </div>
                      <h3 class="text-xl font-bold text-slate-900">${supp.product_offered}</h3>
                      <p class="text-sm font-medium text-slate-500 mt-1 flex items-center gap-2">
                        <svg class="w-4 h-4 text-slate-400" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4"/></svg>
                        ${prof.company_name || 'Hubify Verified Supplier'}
                      </p>
                    </div>
                    <div class="text-right">
                      <div class="text-3xl font-black ${m.final_score > 80 ? 'text-emerald-600' : (m.final_score > 50 ? 'text-amber-500' : 'text-red-500')} tracking-tighter">${m.final_score}<span class="text-lg text-slate-400 font-bold ml-1">/100</span></div>
                      <div class="text-xs font-bold text-slate-400 uppercase tracking-widest mt-1">Match Score</div>
                    </div>
                  </div>

                  <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-6">
                    <div class="bg-slate-50 p-3 rounded-xl border border-slate-100">
                      <div class="text-[10px] uppercase tracking-widest font-bold text-slate-400 mb-1">Unit Price</div>
                      <div class="text-sm font-bold text-slate-900">₹${supp.unit_price} <span class="text-xs text-slate-500 font-medium">/ ${supp.unit}</span></div>
                    </div>
                    <div class="bg-slate-50 p-3 rounded-xl border border-slate-100">
                      <div class="text-[10px] uppercase tracking-widest font-bold text-slate-400 mb-1">Delivery Time</div>
                      <div class="text-sm font-bold text-slate-900">${supp.delivery_days} Days</div>
                    </div>
                    <div class="bg-slate-50 p-3 rounded-xl border border-slate-100">
                      <div class="text-[10px] uppercase tracking-widest font-bold text-slate-400 mb-1">Location</div>
                      <div class="text-sm font-bold text-slate-900">${supp.city}, ${supp.state || supp.country}</div>
                    </div>
                    <div class="bg-slate-50 p-3 rounded-xl border border-slate-100">
                      <div class="text-[10px] uppercase tracking-widest font-bold text-slate-400 mb-1">Available Qty</div>
                      <div class="text-sm font-bold text-slate-900">${supp.available_quantity} ${supp.unit}</div>
                    </div>
                  </div>

                  <div class="mb-6">
                    <h4 class="text-sm font-bold text-slate-900 mb-2">AI Explanation</h4>
                    <p class="text-sm text-slate-600 leading-relaxed">${m.explanation}</p>
                    ${risksHtml}
                    ${dbHtml}
                  </div>
                  
                  <details class="mb-6 group border border-slate-200 rounded-xl bg-white overflow-hidden">
                    <summary class="text-[13px] font-bold text-slate-700 bg-slate-50 cursor-pointer hover:bg-slate-100 select-none flex items-center justify-between px-4 py-3">
                      View Additional Specifications
                      <svg class="w-4 h-4 text-slate-400 transition-transform group-open:rotate-180" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/></svg>
                    </summary>
                    <div class="p-4">
                      <div class="bg-indigo-50/50 p-4 rounded-xl border border-indigo-100">
                        <h4 class="text-[11px] font-bold text-indigo-900 uppercase tracking-widest mb-2 flex items-center gap-2"><svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg> Detailed Specifications</h4>
                        <p class="text-[13px] text-indigo-800 font-medium">Specs: ${supp.specs ? JSON.stringify(supp.specs).replace(/[{""}]/g, ' ') : 'Standard Configuration'}</p>
                        <p class="text-[13px] text-indigo-800 font-medium mt-1">Certifications: ${supp.certifications && supp.certifications.length > 0 ? supp.certifications.join(', ') : 'None specified'}</p>
                        <p class="text-[13px] text-indigo-800 font-medium mt-1">Minimum Order: ${supp.min_order_qty} ${supp.unit}</p>
                      </div>
                    </div>
                  </details>
                  
                  <div class="pt-5 border-t border-slate-100 flex items-center justify-between">
                    <div class="flex items-center gap-6">
                      <div class="flex items-center gap-2">
                        <div class="w-8 h-8 rounded-full bg-indigo-50 text-indigo-600 flex items-center justify-center font-bold text-xs">${(prof.full_name || 'S').charAt(0)}</div>
                        <div class="text-sm">
                          <div class="font-bold text-slate-900">${prof.full_name || 'Contact Representative'}</div>
                          <a href="mailto:${prof.email}" class="text-indigo-600 font-medium hover:underline">${prof.email || 'Contact Info Hidden'}</a>
                        </div>
                      </div>
                    </div>
                    <button class="px-5 py-2.5 bg-slate-900 hover:bg-slate-800 text-white rounded-xl text-[13px] font-bold transition shadow-sm">
                      Initiate Contact
                    </button>
                  </div>
                </div>
              </div>
            `;
          });
        } else {
          container.innerHTML = `
            <div class="data-card rounded-2xl p-16 text-center border border-slate-200 bg-slate-50 mt-10">
              <p class="text-slate-600 text-[15px] font-bold">No matches generated for this requirement yet.</p>
            </div>
          `;
        }
      } catch (e) {
        console.error(e);
        document.getElementById('matches-container').innerHTML = '<p class="text-red-500 p-6">Error loading matches.</p>';
      }
    });
  </script>
</body>
</html>
