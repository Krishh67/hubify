<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Authentication — Hubify</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    *, body { font-family: 'Inter', system-ui, sans-serif; }
    .grid-bg {
      background-color: #f8fafc;
      background-image:
        linear-gradient(rgba(99,102,241,0.06) 1px, transparent 1px),
        linear-gradient(90deg, rgba(99,102,241,0.06) 1px, transparent 1px);
      background-size: 64px 64px;
    }
    .auth-card {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(24px);
      border: 1px solid rgba(226, 232, 240, 1);
      box-shadow: 0 20px 40px -10px rgba(0,0,0,0.05), 0 0 0 1px rgba(0,0,0,0.02);
    }
    .form-input {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      color: #0f172a;
      transition: all 0.2s ease;
    }
    .form-input:focus {
      outline: none;
      border-color: #818cf8;
      box-shadow: 0 0 0 3px rgba(129, 140, 248, 0.2);
      background: #ffffff;
    }
    .form-input::placeholder { color: #94a3b8; }
    .tab-active {
      color: #4f46e5;
      border-bottom: 2px solid #4f46e5;
    }
    .tab-inactive {
      color: #64748b;
      border-bottom: 2px solid transparent;
    }
    .tab-inactive:hover {
      color: #0f172a;
    }
    .role-card {
      border: 1px solid #e2e8f0;
      background: #ffffff;
      transition: all 0.2s ease;
    }
    .role-card:hover {
      border-color: #c7d2fe;
      background: #f8fafc;
    }
    .role-card.selected {
      border-color: #6366f1;
      background: #e0e7ff;
      box-shadow: 0 4px 12px rgba(99,102,241,0.15);
    }
    .role-card.selected svg { color: #4f46e5; }
    .btn-primary {
      background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);
      transition: all 0.25s ease;
    }
    .btn-primary:hover {
      background: linear-gradient(135deg, #4338ca 0%, #6d28d9 100%);
      transform: translateY(-1px);
      box-shadow: 0 12px 24px -6px rgba(99,102,241,0.3);
    }
  </style>
</head>
<body class="grid-bg min-h-screen flex flex-col antialiased text-slate-900">

  <!-- Nav -->
  <div class="absolute top-0 left-0 w-full p-6 flex justify-between items-center z-10">
    <a href="/" class="flex items-center gap-2.5">
      <div class="w-8 h-8 rounded-lg bg-gradient-to-br from-indigo-500 to-violet-600 flex items-center justify-center shadow-md">
        <svg class="w-4 h-4 text-white" viewBox="0 0 16 16" fill="none">
          <path d="M3 8.5L6.5 12L13 5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
      <span class="text-base font-bold text-slate-900 tracking-tight">Hubify</span>
    </a>
  </div>

  <!-- Background Orbs -->
  <div class="fixed top-1/4 -left-20 w-[400px] h-[400px] rounded-full bg-indigo-200/50 filter blur-[100px] pointer-events-none"></div>
  <div class="fixed bottom-1/4 -right-20 w-[400px] h-[400px] rounded-full bg-cyan-200/40 filter blur-[100px] pointer-events-none"></div>

  <!-- Main Content -->
  <div class="flex-1 flex flex-col justify-center items-center p-6 z-10">
    
    <div class="auth-card w-full max-w-[440px] rounded-3xl p-8 md:p-10 relative overflow-hidden">
      <!-- Decor line -->
      <div class="absolute top-0 left-0 w-full h-1.5 bg-gradient-to-r from-indigo-500 via-violet-500 to-cyan-500"></div>

      <!-- Header -->
      <div class="mb-8">
        <h2 id="card-title" class="text-2xl font-extrabold text-slate-900 tracking-tight mb-2">Welcome back</h2>
        <p id="card-subtitle" class="text-[14px] text-slate-500 font-medium">Sign in to your Hubify account</p>
      </div>

      <!-- Error Alert -->
      <div id="error-msg" class="hidden mb-6 p-4 rounded-xl bg-red-50 border border-red-100 text-[13px] text-red-600 font-semibold flex items-center gap-2">
        <svg class="w-4 h-4 text-red-500" viewBox="0 0 24 24" fill="none"><path d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        <span>Error message here</span>
      </div>

      <!-- Tabs -->
      <div class="flex border-b border-slate-200 mb-8">
        <button type="button" id="tab-signin" onclick="switchTab('signin')" class="pb-3 mr-6 text-sm font-semibold tab-active">Sign In</button>
        <button type="button" id="tab-signup" onclick="switchTab('signup')" class="pb-3 text-sm font-semibold tab-inactive">Create Account</button>
      </div>

      <!-- Form -->
      <form id="auth-form" class="space-y-5">
        
        <div id="field-name" class="hidden">
          <label class="block text-[12px] font-bold text-slate-600 uppercase tracking-wider mb-2">Full Name</label>
          <input type="text" id="name" class="form-input w-full px-4 py-3 rounded-xl text-sm font-medium" placeholder="Jane Doe">
        </div>

        <div id="field-company" class="hidden">
          <label class="block text-[12px] font-bold text-slate-600 uppercase tracking-wider mb-2">Company Name</label>
          <input type="text" id="company" class="form-input w-full px-4 py-3 rounded-xl text-sm font-medium" placeholder="Acme Corp">
        </div>

        <div>
          <label class="block text-[12px] font-bold text-slate-600 uppercase tracking-wider mb-2">Email Address</label>
          <input type="email" id="email" class="form-input w-full px-4 py-3 rounded-xl text-sm font-medium" placeholder="jane@company.com">
        </div>

        <div>
          <div class="flex justify-between items-center mb-2">
            <label class="block text-[12px] font-bold text-slate-600 uppercase tracking-wider">Password</label>
            <a href="#" id="forgot-link" class="text-[12px] font-semibold text-indigo-600 hover:text-indigo-700 transition-colors">Forgot?</a>
          </div>
          <input type="password" id="password" class="form-input w-full px-4 py-3 rounded-xl text-sm font-medium" placeholder="••••••••">
        </div>

        <!-- Role Selection -->
        <div id="field-role" class="pt-2">
          <label class="block text-[12px] font-bold text-slate-600 uppercase tracking-wider mb-3">I am a...</label>
          <div class="grid grid-cols-3 gap-3">
            
            <div data-role="client" onclick="selectRole('client', this)" class="role-card selected cursor-pointer rounded-xl p-3 flex flex-col items-center justify-center text-center gap-2">
              <div class="w-8 h-8 rounded-lg bg-indigo-100 flex items-center justify-center">
                <svg class="w-4 h-4 text-indigo-600" viewBox="0 0 24 24" fill="none"><path d="M21 13.255A23.931 23.931 0 0112 15c-3.183 0-6.22-.62-9-1.745M16 6V4a2 2 0 00-2-2h-4a2 2 0 00-2 2v2m4 6h.01M5 20h14a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
              </div>
              <span class="text-[11px] font-bold text-slate-700 uppercase tracking-wide">Client</span>
            </div>

            <div data-role="supplier" onclick="selectRole('supplier', this)" class="role-card cursor-pointer rounded-xl p-3 flex flex-col items-center justify-center text-center gap-2">
              <div class="w-8 h-8 rounded-lg bg-emerald-100 flex items-center justify-center">
                <svg class="w-4 h-4 text-emerald-600" viewBox="0 0 24 24" fill="none"><path d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
              </div>
              <span class="text-[11px] font-bold text-slate-700 uppercase tracking-wide">Supplier</span>
            </div>

            <div data-role="admin" onclick="selectRole('admin', this)" class="role-card cursor-pointer rounded-xl p-3 flex flex-col items-center justify-center text-center gap-2">
              <div class="w-8 h-8 rounded-lg bg-violet-100 flex items-center justify-center">
                <svg class="w-4 h-4 text-violet-600" viewBox="0 0 24 24" fill="none"><path d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
              </div>
              <span class="text-[11px] font-bold text-slate-700 uppercase tracking-wide">Admin</span>
            </div>

          </div>
        </div>

        <button type="submit" id="submit-btn" class="w-full btn-primary text-white text-[14px] font-bold px-4 py-3.5 rounded-xl mt-6 shadow-md">
          Sign In
        </button>

      </form>

      <div class="mt-8 text-center text-[13px] text-slate-500 font-medium" id="switch-link">
        Don't have an account? <button type="button" onclick="switchTab('signup')" class="text-indigo-600 hover:text-indigo-700 font-bold transition-colors ml-1">Create one</button>
      </div>

    </div>
  </div>

  <script src="/js/auth.js"></script>
</body>
</html>
