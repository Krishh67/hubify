<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Supplier Dashboard — Hubify</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    *, body { font-family: 'Inter', system-ui, sans-serif; }
    .grid-bg {
      background-color: #f8fafc;
      background-image:
        linear-gradient(rgba(16, 185, 129, 0.06) 1px, transparent 1px),
        linear-gradient(90deg, rgba(16, 185, 129, 0.06) 1px, transparent 1px);
      background-size: 64px 64px;
    }
    .data-card {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.05);
    }
    .nav-blur {
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      background: rgba(255, 255, 255, 0.9);
    }
  </style>
</head>
<body class="grid-bg min-h-screen text-slate-900 antialiased pb-20">

  <!-- Navbar -->
  <nav class="fixed top-0 left-0 right-0 z-50 h-16 border-b border-slate-200 nav-blur">
    <div class="h-full max-w-7xl mx-auto px-6 flex items-center justify-between">
      <div class="flex items-center gap-6">
        <a href="/" class="flex items-center gap-2.5">
          <div class="w-8 h-8 rounded-lg bg-gradient-to-br from-indigo-500 to-violet-600 flex items-center justify-center flex-shrink-0 shadow-sm">
            <svg class="w-4 h-4 text-white" viewBox="0 0 16 16" fill="none">
              <path d="M3 8.5L6.5 12L13 5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </div>
          <span class="text-base font-bold text-slate-900 tracking-tight hidden sm:block">Hubify</span>
        </a>
        <div class="h-5 w-px bg-slate-200"></div>
        <span class="text-[13px] font-bold text-emerald-600 uppercase tracking-widest">Supplier Portal</span>
      </div>
      <div class="flex items-center gap-5">
        <!-- Notification Bell -->
        <div class="relative cursor-pointer group" id="notif-bell" onclick="toggleNotifications()">
          <svg class="w-6 h-6 text-slate-500 group-hover:text-emerald-600 transition-colors" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9" />
          </svg>
          <span id="notif-badge" class="absolute -top-1 -right-1 flex h-4 w-4 items-center justify-center rounded-full bg-red-500 text-[10px] font-bold text-white hidden">0</span>
          
          <!-- Dropdown -->
          <div id="notif-dropdown" class="absolute right-0 mt-2 w-80 bg-white border border-slate-200 rounded-xl shadow-lg hidden overflow-hidden z-50">
            <div class="px-4 py-3 border-b border-slate-100 bg-slate-50 font-bold text-sm text-slate-700">Notifications</div>
            <div id="notif-list" class="max-h-64 overflow-y-auto">
              <!-- JS will populate this -->
              <div class="p-4 text-center text-sm text-slate-500">No notifications</div>
            </div>
          </div>
        </div>

        <a href="/supplier" class="text-[14px] text-slate-600 hover:text-emerald-600 font-semibold transition-colors">Submit Capability</a>
        <div class="h-5 w-px bg-slate-200"></div>
        <a href="/auth" onclick="localStorage.clear()" class="text-[14px] text-slate-600 hover:text-emerald-600 font-semibold transition-colors">Sign Out</a>
      </div>
    </div>
  </nav>

  <div class="max-w-4xl mx-auto px-6 pt-32">
    <div class="mb-10 flex justify-between items-end">
      <div>
        <h1 class="text-3xl font-extrabold text-slate-900 tracking-tight mb-2">My Capabilities</h1>
        <p class="text-[15px] font-medium text-slate-500">Track your published offerings and incoming buyer matches.</p>
      </div>
      <a href="/supplier" class="hidden md:inline-block px-6 py-3 bg-emerald-600 text-white rounded-xl text-sm font-bold shadow hover:bg-emerald-700 transition">Publish Capability</a>
    </div>

    <div id="records-container" class="space-y-6">
      <div id="empty-state" class="data-card rounded-2xl p-16 text-center border border-slate-200 bg-slate-50 mt-10">
        <div class="w-14 h-14 rounded-full bg-white border border-slate-200 shadow-sm flex items-center justify-center mx-auto mb-5">
          <svg class="w-6 h-6 text-slate-400" viewBox="0 0 24 24" fill="none">
            <path d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
        <p class="text-slate-600 text-[15px] font-bold">You have no active listings.</p>
        <a href="/supplier" class="inline-block mt-6 px-6 py-3 bg-emerald-600 text-white rounded-xl text-sm font-bold shadow hover:bg-emerald-700 transition">Publish Capability</a>
      </div>
    </div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      const profileId = localStorage.getItem('profile_id');
      if (!profileId) {
        window.location.href = '/auth';
        return;
      }
      
      try {
        const res = await fetch(`/api/suppliers?profile_id=${profileId}`);
        const suppliers = await res.json();
        
        if (suppliers && suppliers.length > 0) {
          const container = document.getElementById('records-container');
          container.innerHTML = '';
          
          suppliers.forEach(s => {
            container.innerHTML += `
              <div class="data-card rounded-2xl p-6 hover:border-emerald-200 transition-colors">
                <div class="flex justify-between items-start mb-4">
                  <div>
                    <span class="inline-block px-2.5 py-1 rounded-md bg-emerald-50 text-emerald-700 text-[11px] font-bold uppercase tracking-wider mb-2">${s.category}</span>
                    <h3 class="text-lg font-bold text-slate-900">${s.product_offered}</h3>
                    <p class="text-[13px] text-slate-500 font-medium mt-1">Ref: SUP-${String(s.id).padStart(6, '0')} • Created ${new Date(s.created_at).toLocaleDateString()}</p>
                  </div>
                  <div class="text-right">
                    <div class="text-[15px] font-bold text-slate-900">${s.available_quantity} <span class="text-slate-500 text-[13px]">${s.unit}</span></div>
                    <div class="text-[13px] font-medium text-slate-500 mt-1">Min Order: ${s.min_order_qty}</div>
                  </div>
                </div>
                <div class="pt-4 border-t border-slate-100 flex items-center justify-between">
                  <div class="text-[13px] font-semibold text-slate-600 flex items-center gap-2">
                    <svg class="w-4 h-4 text-slate-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"/><path d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
                    ${s.location}, ${s.city}
                  </div>
                  <div id="match-status-${s.id}">
                    <div class="text-[13px] font-bold text-emerald-600 bg-emerald-50 px-3 py-1.5 rounded-lg flex items-center gap-2 cursor-not-allowed opacity-80">
                      <svg class="w-4 h-4 animate-spin" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>
                      Finding Matches...
                    </div>
                  </div>
                </div>
              </div>
            `;
          });
          
          // Fetch match counts in parallel for suppliers
          suppliers.forEach(async s => {
            try {
              const mRes = await fetch(`/api/matches?supplier_id=${s.id}`);
              const matches = await mRes.json();
              if (matches && matches.length > 0) {
                document.getElementById(`match-status-${s.id}`).innerHTML = `
                  <a href="/supplier/matches?id=${s.id}" class="text-[13px] font-bold text-white bg-emerald-600 hover:bg-emerald-700 px-4 py-2 rounded-lg flex items-center gap-2 transition cursor-pointer shadow-sm">
                    View ${matches.length} Matches &rarr;
                  </a>
                `;
              } else {
                document.getElementById(`match-status-${s.id}`).innerHTML = `
                  <div class="text-[13px] font-bold text-slate-500 bg-slate-50 px-3 py-1.5 rounded-lg flex items-center gap-2 cursor-not-allowed">
                    <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="4.93" y1="4.93" x2="19.07" y2="19.07"/></svg>
                    No matches found
                  </div>
                `;
              }
            } catch(e) {}
          });
        }
      } catch (e) {
        console.error(e);
      }
      
      loadNotifications(profileId);
    });
    
    function toggleNotifications() {
      document.getElementById('notif-dropdown').classList.toggle('hidden');
    }
    
    async function loadNotifications(profileId) {
      try {
        const res = await fetch(`/api/notifications?user_id=${profileId}`);
        const notifs = await res.json();
        const list = document.getElementById('notif-list');
        const badge = document.getElementById('notif-badge');
        
        if (notifs && notifs.length > 0) {
          list.innerHTML = '';
          const unreadCount = notifs.filter(n => !n.is_read).length;
          
          if (unreadCount > 0) {
            badge.textContent = unreadCount;
            badge.classList.remove('hidden');
          }
          
          notifs.forEach(n => {
            const bgClass = n.is_read ? 'bg-white' : 'bg-slate-50';
            list.innerHTML += `
              <div class="p-3 border-b border-slate-100 ${bgClass} hover:bg-slate-50 transition">
                <div class="text-[12px] text-slate-700 font-medium">${n.message}</div>
                <div class="text-[10px] text-slate-400 mt-1">${new Date(n.created_at).toLocaleDateString()}</div>
              </div>
            `;
          });
        }
      } catch (e) {
        console.error("Failed to load notifications", e);
      }
    }
  </script>
</body>
</html>
