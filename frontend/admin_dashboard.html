<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Dashboard — Hubify</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    *, body { font-family: 'Inter', system-ui, sans-serif; }
    .grid-bg {
      background-color: #f8fafc;
      background-image:
        linear-gradient(rgba(139, 92, 246, 0.06) 1px, transparent 1px),
        linear-gradient(90deg, rgba(139, 92, 246, 0.06) 1px, transparent 1px);
      background-size: 64px 64px;
    }
    .metric-card {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      box-shadow: 0 4px 6px -1px rgba(0,0,0,0.02), 0 2px 4px -1px rgba(0,0,0,0.01);
    }
    .data-card {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      transition: all 0.2s ease;
      box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.05);
    }
    .data-card:hover {
      border-color: #c7d2fe;
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.05), 0 4px 6px -2px rgba(0, 0, 0, 0.02);
      transform: translateY(-2px);
    }
    .nav-blur {
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      background: rgba(255, 255, 255, 0.9);
    }
    .tab-btn {
      color: #64748b;
      border-bottom: 2px solid transparent;
      transition: all 0.2s ease;
    }
    .tab-btn:hover { color: #0f172a; }
    .tab-btn.active {
      color: #0f172a;
      border-bottom-color: #8b5cf6;
    }
    .tab-pane { display: none; }
    .tab-pane.active { display: block; animation: fadeIn 0.3s ease; }
    
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes pulse-subtle {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }
    .skeleton-box {
      background: #e2e8f0;
      border-radius: 4px;
      animation: pulse-subtle 1.5s infinite;
    }
  </style>
</head>
<body class="grid-bg min-h-screen text-slate-900 antialiased pb-20">

  <!-- Navbar -->
  <nav class="fixed top-0 left-0 right-0 z-50 h-16 border-b border-slate-200 nav-blur">
    <div class="h-full max-w-7xl mx-auto px-6 flex items-center justify-between">
      <div class="flex items-center gap-6">
        <a href="/" class="flex items-center gap-2.5">
          <div class="w-8 h-8 rounded-lg bg-gradient-to-br from-indigo-500 to-violet-600 flex items-center justify-center flex-shrink-0 shadow-sm">
            <svg class="w-4 h-4 text-white" viewBox="0 0 16 16" fill="none">
              <path d="M3 8.5L6.5 12L13 5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </div>
          <span class="text-base font-bold text-slate-900 tracking-tight hidden sm:block">Hubify</span>
        </a>
        <div class="h-5 w-px bg-slate-200"></div>
        <span class="text-[13px] font-bold text-violet-600 uppercase tracking-widest">Admin Control</span>
      </div>
      <div class="flex items-center gap-5">
        <div class="h-5 w-px bg-slate-200"></div>
        <a href="/auth" onclick="localStorage.clear()" class="text-[14px] text-slate-600 hover:text-indigo-600 font-semibold transition-colors">Sign Out</a>
      </div>
    </div>
  </nav>

  <div class="max-w-7xl mx-auto px-6 pt-32">
    <div class="flex items-end justify-between mb-8">
      <div>
        <h1 class="text-3xl font-extrabold text-slate-900 tracking-tight mb-2">Platform Overview</h1>
        <p class="text-[15px] font-medium text-slate-500">Monitor active procurement requirements, supplier network, and AI matchmaking signals.</p>
      </div>
      <button onclick="loadDashboard()" class="text-[13px] font-bold text-violet-600 hover:text-violet-700 flex items-center gap-2 bg-violet-50 hover:bg-violet-100 px-4 py-2 rounded-xl transition-colors border border-violet-200 shadow-sm">
        <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none">
          <path d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        Refresh Data
      </button>
    </div>

    <!-- Stats Grid -->
    <div class="grid grid-cols-2 md:grid-cols-3 gap-6 mb-12">
      <div class="metric-card rounded-2xl p-6 relative overflow-hidden">
        <div class="absolute -right-4 -top-4 w-24 h-24 bg-blue-50 rounded-full z-0 pointer-events-none"></div>
        <div class="relative z-10">
          <div class="flex items-center gap-3 mb-3">
            <div class="w-10 h-10 rounded-xl bg-blue-100 border border-blue-200 flex items-center justify-center">
              <svg class="w-5 h-5 text-blue-600" viewBox="0 0 24 24" fill="none"><path d="M21 13.255A23.931 23.931 0 0112 15c-3.183 0-6.22-.62-9-1.745M16 6V4a2 2 0 00-2-2h-4a2 2 0 00-2 2v2m4 6h.01M5 20h14a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </div>
            <span class="text-[11px] font-bold text-slate-500 uppercase tracking-wider">Active Clients</span>
          </div>
          <div class="text-4xl font-extrabold text-slate-900" id="stat-clients">--</div>
        </div>
      </div>

      <div class="metric-card rounded-2xl p-6 relative overflow-hidden">
        <div class="absolute -right-4 -top-4 w-24 h-24 bg-emerald-50 rounded-full z-0 pointer-events-none"></div>
        <div class="relative z-10">
          <div class="flex items-center gap-3 mb-3">
            <div class="w-10 h-10 rounded-xl bg-emerald-100 border border-emerald-200 flex items-center justify-center">
              <svg class="w-5 h-5 text-emerald-600" viewBox="0 0 24 24" fill="none"><path d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </div>
            <span class="text-[11px] font-bold text-slate-500 uppercase tracking-wider">Suppliers</span>
          </div>
          <div class="text-4xl font-extrabold text-slate-900" id="stat-suppliers">--</div>
        </div>
      </div>

      <div class="metric-card rounded-2xl p-6 relative overflow-hidden">
        <div class="absolute -right-4 -top-4 w-24 h-24 bg-violet-50 rounded-full z-0 pointer-events-none"></div>
        <div class="relative z-10">
          <div class="flex items-center gap-3 mb-3">
            <div class="w-10 h-10 rounded-xl bg-violet-100 border border-violet-200 flex items-center justify-center">
              <svg class="w-5 h-5 text-violet-600" viewBox="0 0 24 24" fill="none"><path d="M13.828 10.172a4 4 0 00-5.656 0l-4 4a4 4 0 105.656 5.656l1.102-1.101m-.758-4.899a4 4 0 005.656 0l4-4a4 4 0 00-5.656-5.656l-1.1 1.1" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </div>
            <span class="text-[11px] font-bold text-slate-500 uppercase tracking-wider">Matched Requests</span>
          </div>
          <div class="text-4xl font-extrabold text-slate-900" id="stat-matches">--</div>
        </div>
      </div>
    </div>

    <!-- Tabs Header -->
    <div class="flex border-b border-slate-200 mb-8 overflow-x-auto hide-scrollbar">
      <button class="tab-btn active px-6 py-4 text-[15px] font-bold whitespace-nowrap flex items-center gap-2.5" data-target="tab-clients" onclick="switchTab('tab-clients')">
        Requirements
        <span class="text-[11px] bg-slate-100 text-slate-600 px-2.5 py-0.5 rounded-full border border-slate-200 shadow-sm" id="badge-clients">0</span>
      </button>
      <button class="tab-btn px-6 py-4 text-[15px] font-bold whitespace-nowrap flex items-center gap-2.5" data-target="tab-suppliers" onclick="switchTab('tab-suppliers')">
        Supplier Network
        <span class="text-[11px] bg-slate-100 text-slate-600 px-2.5 py-0.5 rounded-full border border-slate-200 shadow-sm" id="badge-suppliers">0</span>
      </button>
      <button class="tab-btn px-6 py-4 text-[15px] font-bold whitespace-nowrap flex items-center gap-2.5" data-target="tab-matches" onclick="switchTab('tab-matches')">
        Matches
        <span class="text-[11px] bg-slate-100 text-slate-600 px-2.5 py-0.5 rounded-full border border-slate-200 shadow-sm" id="badge-matches">0</span>
      </button>
    </div>

    <!-- Tab Contents -->
    <div class="min-h-[400px]">
      
      <!-- Clients Tab -->
      <div id="tab-clients" class="tab-pane active">
        <div class="grid gap-5" id="clients-list">
          <!-- Populated via JS -->
        </div>
      </div>

      <!-- Suppliers Tab -->
      <div id="tab-suppliers" class="tab-pane">
        <div class="grid gap-5" id="suppliers-list">
          <!-- Populated via JS -->
        </div>
      </div>

      <!-- Matches Tab -->
      <div id="tab-matches" class="tab-pane">
        <div class="grid gap-5" id="matches-list">
          <!-- Populated via JS -->
        </div>
      </div>
      
    </div>
  </div>

  <script src="/js/dashboard.js"></script>
</body>
</html>
